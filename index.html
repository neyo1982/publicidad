<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Acceso Wi-Fi All Gamex</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
}

.wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.box {
    width: 100%;
    max-width: 380px;
    max-height: 95vh;

    background: #fff;

    padding: 20px;

    border-radius: 16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    display: flex;
    flex-direction: column;
    align-items: center;
}

h2 {
    margin: 0 0 5px;
    font-size: 18px;
    color: #333;
    text-align: center;
}

p {
    margin: 0 0 15px;
    font-size: 13px;
    color: #666;
    text-align: center;
}

.ad-container {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 15px;

    min-height: 200px;
}

.ad-img {
    display: block;

    width: auto;
    max-width: 100%;
    max-height: 45vh;

    object-fit: contain;

    border-radius: 8px;
}

.btn {
    width: 100%;

    padding: 14px;

    border: 0;
    border-radius: 8px;

    background: #007aff;

    color: #fff;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.btn:disabled {
    background: #e2e8f0;
    color: #4a5568;
    cursor: not-allowed;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="box">

        <h2>Wi-Fi Gratis All Gamex</h2>

        <p>
            Tu navegación se activará al finalizar
            la cuenta regresiva.
        </p>

        <div class="ad-container">

            <img
                id="publicidad"
                class="ad-img"
                src="https://neyo1982.github.io/publicidad/assets/agxpub.jpg"
                alt="Publicidad All Gamex">

        </div>

        <form id="omadaForm" method="post">

            <button
                type="submit"
                id="accionBtn"
                class="btn"
                disabled>

                Espera... (15s)

            </button>

        </form>

    </div>

</div>

<script>

const imagenes = [
    "https://neyo1982.github.io/publicidad/assets/agxpub.jpg",
    "https://neyo1982.github.io/publicidad/assets/agxpub2.jpg",
    "https://neyo1982.github.io/publicidad/assets/agxpub3.jpg"
];

const img = document.getElementById("publicidad");

const seleccion =
    imagenes[Math.floor(Math.random() * imagenes.length)];

img.src = seleccion;

/*
 * Si falla la imagen seleccionada,
 * intenta una imagen conocida.
 */
img.onerror = function () {

    this.onerror = null;

    this.src =
        "https://neyo1982.github.io/publicidad/assets/agxpub.jpg";
};


/*
 * Obtener parámetros enviados por Omada
 */
const params =
    new URLSearchParams(window.location.search);

const target =
    params.get("target");

if (target) {

    document
        .getElementById("omadaForm")
        .action = target;

}


/*
 * CUENTA REGRESIVA
 */

const boton =
    document.getElementById("accionBtn");

let tiempo = 15;

const intervalo =
    setInterval(function () {

        tiempo--;

        boton.textContent =
            "Espera... (" + tiempo + "s)";

        if (tiempo <= 0) {

            clearInterval(intervalo);

            boton.disabled = false;

            boton.textContent =
                "Conectarse a Internet Gratis";

        }

    }, 1000);

</script>

</body>
</html>
