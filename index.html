<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Wi-Fi All Gamex</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f0f2f5; font-family: -apple-system, sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 15px; }
        .box { width: 100%; max-width: 380px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; max-height: 95vh; }
        h2 { font-size: 18px; color: #333; margin: 0 0 5px 0; text-align: center; }
        p { font-size: 13px; color: #666; margin: 0 0 15px 0; text-align: center; }
        .ad-container { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; margin-bottom: 15px; }
        .ad-img { max-width: 100%; max-height: 45vh; object-fit: contain; border-radius: 8px; }
        .btn { width: 100%; padding: 14px; background-color: #e2e8f0; color: #4a5568; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: not-allowed; text-align: center; width: 100%; display: block; -webkit-appearance: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="box">
        <h2>Wi-Fi Gratis All Gamex</h2>
        <p>Por seguridad, tu navegación se activará al terminar el tiempo.</p>
        
        <div class="ad-container">
            <img id="publicidad" class="ad-img" src="" alt="Anuncio All Gamex">
        </div>

        <form id="omadaForm" method="post" style="width: 100%;">
            <!-- Inputs ocultos requeridos por la controladora de Omada para validar el paso -->
            <input type="hidden" id="clientMac" name="clientMac" value="">
            <input type="hidden" id="apMac" name="apMac" value="">
            
            <input type="button" id="accionBtn" class="btn" value="Espera... (15s)" disabled>
        </form>
    </div>
</div>

<script>
    // LISTA DE IMÁGENES APUNTANDO A TU WEB DE GITHUB
    const misImagenes = [
        "https://neyo1982.github.io/publicidad/assets/agxpub.jpg",
        "https://neyo1982.github.io/publicidad/assets/agxpub2.jpg",
        "https://neyo1982.github.io/publicidad/assets/agxpub3.jpg"
    ];

    // Selección aleatoria inmediata de la imagen
    const imagenAleatoria = misImagenes[Math.floor(Math.random() * misImagenes.length)];
    document.getElementById('publicidad').src = imagenAleatoria;

    // Retrasamos la lectura de parámetros para estabilizar el navegador nativo de Android
    setTimeout(function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // REGLA OMADA: El formulario debe ir a 'authUrl' (que es la IP del ER605), NO a 'target'
        const authUrl = urlParams.get('authUrl'); 
        const clientMac = urlParams.get('clientMac') || '';
        const apMac = urlParams.get('apMac') || '';
        
        if (authUrl) {
            document.getElementById('omadaForm').action = authUrl;
        }
        document.getElementById('clientMac').value = clientMac;
        document.getElementById('apMac').value = apMac;

        // INICIAR TEMPORIZADOR
        const boton = document.getElementById('accionBtn');
        let tiempo = 15;

        const cuentaRegresiva = setInterval(function() {
            tiempo--;
            boton.value = "Espera... (" + tiempo + "s)";
            
            if (tiempo <= 0) {
                clearInterval(cuentaRegresiva);
                boton.disabled = false;
                boton.style.backgroundColor = "#28a745";
                boton.style.color = "white";
                boton.style.cursor = "pointer";
                boton.value = "Conectarse a Internet Gratis";
                
                // Al hacer clic, enviamos directamente el formulario contenedor
                boton.onclick = function() {
                    document.getElementById('omadaForm').submit();
                };
            }
        }, 1000);

    }, 600); // 600 milisegundos de respiro para Android
</script>

</body>
</html>
