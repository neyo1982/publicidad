<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conexión Wi-Fi Gratis</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f0f2f5; font-family: -apple-system, sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 15px; }
        .box { width: 100%; max-width: 380px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; max-height: 95vh; }
        h2 { font-size: 18px; color: #333; margin: 0 0 5px 0; text-align: center; }
        p { font-size: 13px; color: #666; margin: 0 0 15px 0; text-align: center; }
        .ad-container { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; margin-bottom: 15px; }
        .ad-img { max-width: 100%; max-height: 45vh; object-fit: contain; border-radius: 8px; }
        .btn { width: 100%; padding: 14px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="box">
        <h2>Acceso a Wi-Fi Gratis</h2>
        <p>Tu internet se activará al finalizar la cuenta regresiva.</p>
        
        <div class="ad-container">
            <!-- Forzamos la URL larga absoluta para que Windows la renderice sin errores -->
            <img id="publicidad" class="ad-img" src="" alt="Anuncio">
        </div>

        <!-- Botón interactivo nativo -->
        <form id="omadaForm" method="post" style="width: 100%;">
            <input type="submit" id="accionBtn" class="btn" value="Espera... (15s)">
        </form>
    </div>
</div>

<script>
    // LISTA OFICIAL CON ENLACES ABSOLUTOS (Solución para Windows Laptop)
    const misImagenes = [
        "https://neyo1982.github.io/publicidad/agxpub.jpg",
        "https://neyo1982.github.io/publicidad/agxpub2.jpg",
        "https://neyo1982.github.io/publicidad/agxpub3.jpg"
    ];

    // Carga de la foto al azar de inmediato al abrir la página web
    const imagenAleatoria = misImagenes[Math.floor(Math.random() * misImagenes.length)];
    document.getElementById('publicidad').src = imagenAleatoria;

    // Rescatamos los parámetros de autenticación que Omada envía por la URL
    const params = new URLSearchParams(window.location.search);
    const submitUrl = params.get('target') || 'https://omadanetworks.com';
    document.getElementById('omadaForm').action = submitUrl;

    // CONTROL DE LA CUENTA REGRESIVA DEL BOTÓN
    const boton = document.getElementById('accionBtn');
    boton.disabled = true;
    boton.style.backgroundColor = "#e2e8f0";
    boton.style.color = "#4a5568";
    boton.style.cursor = "not-allowed";

    let cuenta = 15;
    const reloj = setInterval(function() {
        cuenta--;
        boton.value = "Espera... (" + cuenta + "s)";
        
        if (cuenta <= 0) {
            clearInterval(reloj);
            boton.disabled = false;
            boton.style.backgroundColor = "#28a745";
            boton.style.color = "white";
            boton.style.cursor = "pointer";
            boton.value = "Obtener Internet Gratis";
        }
    }, 1000);
</script>

</body>
</html>
