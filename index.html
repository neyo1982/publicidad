<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Gratis</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f0f2f5; font-family: -apple-system, sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 15px; }
        .box { width: 100%; max-width: 380px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; max-height: 95vh; }
        h2 { font-size: 18px; color: #333; margin: 0 0 5px 0; text-align: center; }
        p { font-size: 13px; color: #666; margin: 0 0 15px 0; text-align: center; }
        .ad-container { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; margin-bottom: 15px; }
        .ad-img { max-width: 100%; max-height: 45vh; object-fit: contain; border-radius: 8px; display: none; } /* Oculta al inicio */
        .btn { width: 100%; padding: 14px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="box">
        <h2>Acceso a Wi-Fi Gratis</h2>
        <p id="subtitulo">Presiona el botón para activar tu navegación.</p>
        
        <div class="ad-container">
            <!-- Espacio listo para tus imágenes -->
            <img id="publicidad" class="ad-img" src="" alt="Anuncio">
        </div>

        <!-- Este botón iniciará el flujo en todos los equipos -->
        <button id="accionBtn" class="btn" onclick="iniciarAnuncio()">Ver Anuncio (15s)</button>

        <!-- Formulario oculto que Omada necesita para liberar el internet -->
        <form id="omadaForm" method="post" style="display:none;">
            <input type="submit" id="submitReal">
        </form>
    </div>
</div>

<script>
    // LISTA DE TUS IMÁGENES (Añade las 30 repitiendo este formato corto)
    const misImagenes = [
        "agxpub.jpg",
        "agxpub2.jpg",
        "agx3pub.jpg"
    ];

    // Rescatamos los datos de conexión que envía Omada por la URL
    const params = new URLSearchParams(window.location.search);
    const submitUrl = params.get('target') || 'https://omadanetworks.com';
    document.getElementById('omadaForm').action = submitUrl;

    function iniciarAnuncio() {
        // 1. Mostrar la imagen publicitaria al azar
        const imagenAleatoria = misImagenes[Math.floor(Math.random() * misImagenes.length)];
        const foto = document.getElementById('publicidad');
        foto.src = imagenAleatoria;
        foto.style.display = "block";

        // 2. Modificar textos del portal
        document.getElementById('subtitulo').innerText = "Cargando acceso a internet gratis...";
        
        // 3. Congelar el botón e iniciar el contador
        const boton = document.getElementById('accionBtn');
        boton.disabled = true;
        boton.style.backgroundColor = "#e2e8f0";
        boton.style.color = "#4a5568";
        boton.style.cursor = "not-allowed";

        let cuenta = 15;
        boton.innerText = "Espera... (" + cuenta + "s)";

        const reloj = setInterval(function() {
            cuenta--;
            boton.innerText = "Espera... (" + cuenta + "s)";
            
            if (cuenta <= 0) {
                clearInterval(reloj);
                boton.innerText = "¡Conectando al Wi-Fi!";
                boton.style.backgroundColor = "#28a745";
                boton.style.color = "white";
                
                // Hace el envío del formulario físico a Omada para darle internet real al usuario
                document.getElementById('submitReal').click();
            }
        }, 1000);
    }
</script>

</body>
</html>
