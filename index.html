<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Gratis All Gamex</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; background-color: #f0f2f5; font-family: -apple-system, sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 15px; }
        .box { width: 100%; max-width: 380px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center; max-height: 95vh; }
        h2 { font-size: 18px; color: #333; margin: 0 0 5px 0; text-align: center; }
        p { font-size: 13px; color: #666; margin: 0 0 15px 0; text-align: center; }
        .ad-container { width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; margin-bottom: 15px; }
        .ad-img { max-width: 100%; max-height: 45vh; object-fit: contain; border-radius: 8px; }
        
        .timer-box { 
            width: 100%;
            padding: 14px; 
            background-color: #e2e8f0; 
            color: #4a5568; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: bold; 
            text-align: center;
            transition: 0.3s;
        }
        .reveal-code {
            background-color: #28a745 !important;
            color: white !important;
            font-size: 18px !important;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="box">
        <h2>Wi-Fi Gratis All Gamex</h2>
        <p>Tu clave se revelará al finalizar la cuenta regresiva.</p>
        
        <div class="ad-container">
            <!-- Espacio para tus imágenes (se inyectan por script abajo) -->
            <img id="publicidad" class="ad-img" src="" alt="Anuncio All Gamex">
        </div>

        <!-- Contenedor del reloj que luego mostrará tu código de Omada -->
        <div id="contadorVisual" class="timer-box">
            Espera... (15s)
        </div>
    </div>
</div>

<script>
    // 1. TUS IMÁGENES DENTRO DE LA CARPETA ASSETS
    const misImagenes = [
        "https://neyo1982.github.io/publicidad/assets/agxpub.jpg",
        "https://neyo1982.github.io/publicidad/assets/agxpub2.jpg",
        "https://neyo1982.github.io/publicidad/assets/agxpub3.jpg"
    ];

    // Carga aleatoria de imagen de All Gamex
    const imagenAleatoria = misImagenes[Math.floor(Math.random() * misImagenes.length)];
    document.getElementById('publicidad').src = imagenAleatoria;

    // 2. CUENTA REGRESIVA DE 15 SEGUNDOS
    const visualBox = document.getElementById('contadorVisual');
    let tiempo = 15;

    const reloj = setInterval(function() {
        tiempo--;
        visualBox.innerText = "Espera... (" + tiempo + "s)";
        
        if (tiempo <= 0) {
            clearInterval(reloj);
            // Revelamos tu código oficial de Omada en verde brillante
            visualBox.classList.add('reveal-code');
            visualBox.innerHTML = "CLAVE WI-FI: <strong>BGXOSC</strong>";
        }
    }, 1000);
</script>

</body>
</html>
